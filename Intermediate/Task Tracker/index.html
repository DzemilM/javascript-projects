<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="tracker">
    <h1 class="tracker__title">Task Tracker</h1>

    <!--
      A <form>, so pressing Enter in the input and clicking the button
      both fire the same "submit" event.
    -->
    <form class="task-form" id="taskForm" autocomplete="off">
      <input
        type="text"
        class="task-form__input"
        id="taskInput"
        placeholder="Start writing and press enter to create task"
        aria-label="New task"
      />
      <button type="submit" class="task-form__submit" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 10 4 15 9 20" />
          <path d="M20 4v7a4 4 0 0 1-4 4H4" />
        </svg>
      </button>
    </form>

    <!--
      Your renderTasks() fills this list. Each task should look like this:

      <li class="task" data-id="...">
        <input type="checkbox" class="task__checkbox" />
        <span class="task__text">Task description</span>
        <button type="button" class="task__delete" aria-label="Delete task"></button>
      </li>

      Add the class `is-completed` to the <li> for a completed task.
      The trash icon comes from CSS - the button stays empty.
    -->
    <ul class="task-list" id="taskList"></ul>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
